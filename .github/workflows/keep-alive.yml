-- ===================================================================
--  Inventory Tracker — Supabase database schema
--  Run this once in your Supabase project:
--  Dashboard  ->  SQL Editor  ->  New query  ->  paste this  ->  Run
-- ===================================================================

-- ---------- PRODUCTS TABLE ----------
create table if not exists public.products (
  id          uuid primary key default gen_random_uuid(),
  user_id     uuid not null references auth.users (id) on delete cascade,
  name        text not null,
  sku         text not null default '',
  category    text not null default 'Uncategorized',
  quantity    integer not null default 0,
  price       numeric(12,2) not null default 0,
  low_stock   integer not null default 5,
  created_at  timestamptz not null default now()
);

-- ---------- HISTORY TABLE ----------
create table if not exists public.history (
  id          uuid primary key default gen_random_uuid(),
  user_id     uuid not null references auth.users (id) on delete cascade,
  type        text not null,
  name        text not null,
  detail      text not null default '',
  delta       integer,
  created_at  timestamptz not null default now()
);

-- ---------- ROW LEVEL SECURITY ----------
-- Ensures each signed-in account can ONLY see and edit its own rows.
alter table public.products enable row level security;
alter table public.history  enable row level security;

drop policy if exists "own products" on public.products;
create policy "own products"
  on public.products for all
  using      (auth.uid() = user_id)
  with check (auth.uid() = user_id);

drop policy if exists "own history" on public.history;
create policy "own history"
  on public.history for all
  using      (auth.uid() = user_id)
  with check (auth.uid() = user_id);

-- ---------- REALTIME (live sync across devices) ----------
-- Adds the tables to the realtime publication so changes on one
-- device push instantly to your other open devices.
-- (Wrapped so re-running this whole file never errors.)
do $$
begin
  alter publication supabase_realtime add table public.products;
exception when duplicate_object then null;
end $$;

do $$
begin
  alter publication supabase_realtime add table public.history;
exception when duplicate_object then null;
end $$;

-- ---------- KEEP-ALIVE TABLE ----------
-- A single-row heartbeat table. A scheduled GitHub Action writes to it
-- once a day; that write is real database activity, which resets
-- Supabase's 7-day inactivity timer so the free project never pauses.
create table if not exists public.keep_alive (
  id         smallint primary key,
  last_ping  timestamptz not null default now()
);
insert into public.keep_alive (id) values (1) on conflict (id) do nothing;

alter table public.keep_alive enable row level security;

drop policy if exists "keep-alive ping" on public.keep_alive;
create policy "keep-alive ping"
  on public.keep_alive for all
  to anon
  using (true) with check (true);

grant select, insert, update on public.keep_alive to anon;

-- ---------- HELPFUL INDEXES ----------
create index if not exists products_user_idx on public.products (user_id);
create index if not exists history_user_idx  on public.history  (user_id, created_at desc);
